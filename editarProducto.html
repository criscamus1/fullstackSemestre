<div class="container mt-4" style="max-width: 600px;">
    <h2>Editar Producto</h2>
    <div id="alerta" class="alert d-none" role="alert"></div>

    <form id="formEditarUsuario" class="mt-3">
        <div class="mb-3">
            <label for="idProducto" class="form-label">ID</label>
            <input type="text" class="form-control" id="idProducto" readonly disabled>
        </div>
        <div class="mb-3">
            <label for="nombreProducto" class="form-label">Nombre </label>
            <input type="text" class="form-control" id="nombreProducto" required>
        </div>
        <div class="mb-3">
            <label for="precioProducto" class="form-label">Precio</label>
            <input type="number" class="form-control" id="precioProducto" required>
        </div>
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
        <a href="product.html" class="btn btn-secondary ms-2">Volver</a>
    </form>
</div>
<script src="js/productosInfo.js"></script>
<script>
    // 1) Buscar el producto por su id (viene en la URL: editarProducto.html?id=3)
    const id = new URLSearchParams(location.search).get("id");
    const producto = buscar(id);
    const alerta = document.getElementById("alerta");
    const form = document.getElementById("formEditarProducto");

    function mensaje(texto, tipo) {
        alerta.className = "alert alert-" + tipo;
        alerta.textContent = texto;
    }

    if (!producto) {
        mensaje("Producto no encontrado.", "danger");
        form.style.display = "none";
    } else {
        // 2) Mostrar sus datos actuales en el formulario
        document.getElementById("idProducto").value = producto.id;
        document.getElementById("nombreProducto").value = producto.nombre;
        document.getElementById("precioProducto").value = producto.precio;
        document.getElementById("stockProducto").value = stockDe(producto.id);
    }

    form.addEventListener("submit", (e) => {
        e.preventDefault();
        const nombre = document.getElementById("nombreProducto").value.trim();
        const precio = Number(document.getElementById("precioProducto").value);
        const stock = Number(document.getElementById("stockProducto").value);

        // 3) Validar
        if (nombre.length < 2) return mensaje("El nombre debe tener al menos 2 letras.", "danger");
        if (!Number.isInteger(precio) || precio <= 0) return mensaje("El precio debe ser un número entero mayor a 0.", "danger");
        if (!Number.isInteger(stock) || stock < 0) return mensaje("El stock debe ser un número entero (0 o más).", "danger");

        // 4) Guardar: se reemplaza SOLO el producto con ese id y se guarda toda la lista
        const lista = todosLosProductos().map((p) => (p.id == producto.id ? { ...p, nombre: nombre, precio: precio } : p));
        guardarProductos(lista);
        guardarStock(producto.id, stock);

        mensaje("¡Producto actualizado! Redirigiendo...", "success");
        setTimeout(() => (location.href = "product.html"), 1000);
    });
</script>

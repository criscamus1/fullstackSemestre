<div class="container mt-4" style="max-width: 600px;">
    <h2>Editar Producto</h2>
    <div id="alerta" class="alert d-none" role="alert"></div>

    <form id="formEditarUsuario" class="mt-3">
        <div class="mb-3">
            <label for="idProducto" class="form-label">ID</label>
            <input type="text" class="form-control" id="idProducto" readonly disabled>
        </div>
        <div class="mb-3">
            <label for="nombreProducto" class="form-label">Nombre </label>
            <input type="text" class="form-control" id="nombreProducto" required>
        </div>
        <div class="mb-3">
            <label for="precioProducto" class="form-label">Precio</label>
            <input type="number" class="form-control" id="precioProducto" required>
        </div>
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
        <a href="product.html" class="btn btn-secondary ms-2">Volver</a>
    </form>
</div>
<script src="js/productosInfo.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');
    const productIndexParam = params.get('index');

    const listaProductos = JSON.parse(localStorage.getItem('productos')) || [...productosData];

    let productIndex = -1;
    if (productIndexParam !== null && listaProductos[productIndexParam]) {
        productIndex = parseInt(productIndexParam);
    } else if (productId) {
        productIndex = listaProductos.findIndex(p => p.id == productId);
    }

    const inputId = document.getElementById('idProducto');
    const inputNombre = document.getElementById('nombreProducto');
    const inputPrecio = document.getElementById('precioProducto');
    const alerta = document.getElementById('alerta');

    if (productIndex !== -1 && listaProductos[productIndex]) {
        const producto = listaProductos[productIndex];
        inputId.value = producto.id;
        inputNombre.value = producto.nombre;
        inputPrecio.value = producto.precio;
    } else {
        alerta.className = "alert alert-danger";
        alerta.textContent = "Producto no encontrado.";
        alerta.classList.remove("d-none");
        document.getElementById('formEditarProducto').style.display = 'none';
    }

    document.getElementById('formEditarProducto').addEventListener('submit', function(e) {
        e.preventDefault();

        if (productIndex !== -1) {
            listaProductos[productIndex].nombre = inputNombre.value.trim();
            listaProductos[productIndex].precio = Number(inputPrecio.value);

            localStorage.setItem('productos', JSON.stringify(listaProductos));

            alerta.className = "alert alert-success";
            alerta.textContent = "¡Producto actualizado con éxito! Redirigiendo...";
            alerta.classList.remove("d-none");

            setTimeout(() => {
                window.location.href = "product.html";
            }, 1200);
        }
    });
</script>

<div class="container mt-4" style="max-width: 600px;">
    <h2>Editar Usuario</h2>
    <div id="alerta" class="alert d-none" role="alert"></div>

    <form id="formEditarUsuario" class="mt-3">
        <div class="mb-3">
            <label for="idUsuario" class="form-label">ID</label>

<script src="js/detalleProducto.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');
    const productName = params.get('nombre');
    const productIndex = params.get('index');

    let productosData = JSON.parse(localStorage.getItem('productos')) || (typeof datosProductos !== "undefined" ? [...datosProductos] : []);

    let productoIndex = -1;
    if (productIndex !== null && productosData[productIndex]) {
        productIndex = parseInt(productIndex);
    } else if (productName) {
        productIndex = productosData.findIndex(p=> p.name === productName);
    } else if (productId) {
        productIndex = productosData.findIndex(p => p.id == productId);
    }

    const inputId = document.getElementById('idProducto');
    const inputNombre = document.getElementById('nombreProducto');
    const inputPrecio = document.getElementById('precioProducto');
    const alerta = document.getElementById('alerta');

    if (productIndex !== -1 && productosData[productIndex]) {
        const producto = productosData[productIndex];
        inputId.value = producto.id;
        inputNombre.value = producto.nombre;
        inputPrecio.value = producto.precio;
    } else {
        alerta.className = "alert alert-danger";
        alerta.textContent = "Usuario no encontrado.";
        alerta.classList.remove("d-none");
        document.getElementById('formEditarProducto').style.display = 'none';
    }

            alerta.className = "alert alert-success";
            alerta.textContent = "¡Producto actualizado con éxito! Redirigiendo...";
            alerta.classList.remove("d-none");

        }
    });
</script>

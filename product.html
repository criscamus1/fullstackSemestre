<h2>Listado de productos</h2>
<div id="productos"></div>
<table id="tablaproductos">
<thead>
        <tr> 
            <th>Nombre</th>
            <th>Precio</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>
<script src="js/detalleProducto.js"></script>
<script>
 const tbody = document.querySelector("#tablaproductostbody");
    const listaProductos = JSON.parse(localStorage.getItem('productos')) || (typeof datosUsuarios !== "undefined" ? datosUsuarios : []);

    listaProductos.forEach((producto, index) => {
        const fila = document.createElement("tr");
        fila.innerHTML = `
            <td>${producto.id}</td>
            <td>${producto.nombre}</td>
            <td><a href="editarProducto.html?id=${producto.id}&index=${index}&email=${encodeURIComponent(producto.precio)}">${producto.precio}</a></td>
        `;
        tbody.appendChild(fila);
    });
</script>

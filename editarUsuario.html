<div class="container mt-4" style="max-width: 600px;">
    <h2>Editar Usuario</h2>
    <div id="alerta" class="alert d-none" role="alert"></div>

    <form id="formEditarUsuario" class="mt-3">
        <div class="mb-3">
            <label for="idUsuario" class="form-label">ID</label>
            <input type="text" class="form-control" id="idUsuario" readonly disabled>
        </div>
        <div class="mb-3">
            <label for="nombreUsuario" class="form-label">Nombre Completo</label>
            <input type="text" class="form-control" id="nombreUsuario" required>
        </div>
        <div class="mb-3">
            <label for="emailUsuario" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="emailUsuario" required>
        </div>
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
        <a href="usuarios.html" class="btn btn-secondary ms-2">Volver</a>
    </form>
</div>

<script src="js/usuarios.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const userId = params.get('id');
    const userEmail = params.get('email');
    const userIndex = params.get('index');

    let listaUsuarios = JSON.parse(localStorage.getItem('usuarios')) || (typeof datosUsuarios !== "undefined" ? [...datosUsuarios] : []);

    let usuarioIndex = -1;
    if (userIndex !== null && listaUsuarios[userIndex]) {
        usuarioIndex = parseInt(userIndex);
    } else if (userEmail) {
        usuarioIndex = listaUsuarios.findIndex(u => u.email === userEmail);
    } else if (userId) {
        usuarioIndex = listaUsuarios.findIndex(u => u.id == userId);
    }

    const inputId = document.getElementById('idUsuario');
    const inputNombre = document.getElementById('nombreUsuario');
    const inputEmail = document.getElementById('emailUsuario');
    const alerta = document.getElementById('alerta');

    if (usuarioIndex !== -1 && listaUsuarios[usuarioIndex]) {
        const usuario = listaUsuarios[usuarioIndex];
        inputId.value = usuario.id;
        inputNombre.value = usuario.nombre;
        inputEmail.value = usuario.email;
    } else {
        alerta.className = "alert alert-danger";
        alerta.textContent = "Usuario no encontrado.";
        alerta.classList.remove("d-none");
        document.getElementById('formEditarUsuario').style.display = 'none';
    }

    document.getElementById('formEditarUsuario').addEventListener('submit', function(e) {
        e.preventDefault();

        if (usuarioIndex !== -1) {
            listaUsuarios[usuarioIndex].nombre = inputNombre.value.trim();
            listaUsuarios[usuarioIndex].email = inputEmail.value.trim();

            localStorage.setItem('usuarios', JSON.stringify(listaUsuarios));

            alerta.className = "alert alert-success";
            alerta.textContent = "¡Usuario actualizado con éxito! Redirigiendo...";
            alerta.classList.remove("d-none");

            setTimeout(() => {
                window.location.href = "usuarios.html";
            }, 1200);
        }
    });
</script>

<div class="container mt-4" style="max-width: 600px;">
    <h2>Editar Usuario</h2>
    <div id="alerta" class="alert d-none" role="alert"></div>

    <form id="formEditarUsuario" class="mt-3">
        <div class="mb-3">
            <label for="idUsuario" class="form-label">ID</label>
            <input type="text" class="form-control" id="idUsuario" readonly disabled>
        </div>
        <div class="mb-3">
            <label for="nombreUsuario" class="form-label">Nombre Completo</label>
            <input type="text" class="form-control" id="nombreUsuario" required>
        </div>
        <div class="mb-3">
            <label for="emailUsuario" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="emailUsuario" required>
        </div>
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
        <a href="usuarios.html" class="btn btn-secondary ms-2">Volver</a>
    </form>
</div>

<script src="js/usuarios.js"></script>
<script>
    // 1) Buscar el usuario por su id (viene en la URL: editarUsuario.html?id=2)
    const id = new URLSearchParams(location.search).get("id");
    const usuario = todosLosUsuarios().find((u) => u.id == id);
    const alerta = document.getElementById("alerta");
    const form = document.getElementById("formEditarUsuario");

    function mensaje(texto, tipo) {
        alerta.className = "alert alert-" + tipo;
        alerta.textContent = texto;
    }

    if (!usuario) {
        mensaje("Usuario no encontrado.", "danger");
        form.style.display = "none";
    } else {
        document.getElementById("idUsuario").value = usuario.id;
        document.getElementById("nombreUsuario").value = usuario.nombre;
        document.getElementById("emailUsuario").value = usuario.email;
    }

    form.addEventListener("submit", (e) => {
        e.preventDefault();
        const nombre = document.getElementById("nombreUsuario").value.trim();
        const email = document.getElementById("emailUsuario").value.trim();

        // 2) Validar (nombre, correo válido y que no lo use otro usuario)
        const error = validarUsuario(nombre, email, usuario.id);
        if (error) return mensaje(error, "danger");

        // 3) Guardar: se reemplaza SOLO el usuario con ese id
        guardarUsuarios(todosLosUsuarios().map((u) => (u.id == usuario.id ? { ...u, nombre: nombre, email: email } : u)));

        mensaje("¡Usuario actualizado! Redirigiendo...", "success");
        setTimeout(() => (location.href = "usuarios.html"), 1000);
    });
</script>
